[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "faturapt"
dynamic = ["version"]
description = "Leitura e validação do código QR das faturas portuguesas (AT) e de NIFs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "José Ferrão" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["portugal", "fatura", "invoice", "qr code", "nif", "atcud", "autoridade tributária"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: Portuguese",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/JoseFerrao20/faturapt"
Changelog = "https://github.com/JoseFerrao20/faturapt/blob/main/CHANGELOG.md"

[project.scripts]
faturapt = "faturapt.__main__:main"

[project.optional-dependencies]
image = [
    "pillow>=10",
    "zxing-cpp>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.100",
    "segno>=1.6.6",
]

[tool.hatch.version]
path = "src/faturapt/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-local-folder = ["test_qr"]  # os testes importam os exemplos uns dos outros

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E402"]  # assert nos testes; imports depois do importorskip

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--doctest-glob=README.md --cov=faturapt --cov-report=term-missing --cov-fail-under=95"
