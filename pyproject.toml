[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "faturapt"
dynamic = ["version"]
description = "Leitura e validação do código QR das faturas portuguesas (AT) e de NIFs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "José Ferrão" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["portugal", "fatura", "invoice", "qr code", "nif", "atcud", "autoridade tributária"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: Portuguese",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/JoseFerrao20/faturapt"
Changelog = "https://github.com/JoseFerrao20/faturapt/blob/main/CHANGELOG.md"

[project.scripts]
faturapt = "faturapt.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.version]
path = "src/faturapt/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert é a forma de escrever testes com o pytest

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--doctest-glob=README.md --cov=faturapt --cov-report=term-missing --cov-fail-under=95"
