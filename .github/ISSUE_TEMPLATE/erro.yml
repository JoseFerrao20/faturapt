name: Erro
description: O faturapt leu mal uma fatura, recusou uma que é válida ou deu um erro.
labels: [erro]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado! Antes de colar o texto do QR, **troca os NIFs de pessoas** por outros de exemplo (por exemplo `999999990`).
  - type: textarea
    id: qr
    attributes:
      label: Texto do QR (ou o que usaste)
      description: O texto completo do QR, ou como chamaste a função (read_image, read_pdf, linha de comandos).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que esperavas e o que aconteceu
      description: Inclui a mensagem de erro, se houver.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versões
      placeholder: faturapt 0.2.0, Python 3.12, Windows 11
